apply plugin: 'com.android.library'

group = 'expo.modules.schedulerservice'
version = ''

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.schedulerservice"
  defaultConfig {
    versionCode 1
    versionName ""
  }
  lintOptions {
    abortOnError false
  }
}

// Needed for SchedulerAlarmReceiver / SchedulerTaskService / SchedulerBootReceiver,
// which call into com.facebook.react.HeadlessJsTaskService (and its
// Arguments/HeadlessJsTaskConfig helpers) to boot the "SchedulerCheckTask"
// headless JS task. useCoreDependencies() above only pulls in
// expo-modules-core — it does not expose the React Native Android
// artifact to this module's own compile classpath, so it has to be
// declared here explicitly. No version is pinned: the React Native
// Gradle Plugin, applied at the root project during prebuild, substitutes
// this in with whatever RN version the app itself is on (0.81.5 here),
// the same way it does for the app module — so this stays correct across
// RN upgrades without needing to be bumped by hand.
dependencies {
  implementation("com.facebook.react:react-android")
}
